<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceder — NŌVA Pilates Studio</title>
  <meta name="description" content="Accede a tu espacio NŌVA para reservar clases, revisar tu bono y recibir notificaciones." />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://nova-pilates.vercel.app/login" />
  <meta property="og:title" content="Acceso | NŌVA Pilates Studio" />
  <meta property="og:description" content="Inicia sesión en tu espacio personal de NŌVA." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nova-pilates.vercel.app/login" />
  <meta property="og:image" content="https://nova-pilates.vercel.app/assets/branding/og-image.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="/assets/branding/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/branding/logo-isotipo.svg" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Figtree:wght@400;500;600&display=swap');
    :root {
      --bg: #FAF8F5; --panel: #FFFFFF; --ink: #262626; --ink-soft: #59524C;
      --line: #DFDACF; --line-strong: #C4BEB2; --accent: #4D403A; --accent-soft: #63544C;
      --accent-ink: #FAF8F5; --dash: #A3968D;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Figtree', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--ink); min-height: 100svh; }
    .wrap { min-height: 100svh; display: grid; place-items: center; padding: 2rem; }
    .card {
      width: 100%; max-width: 460px; background: var(--panel);
      border: 1px solid var(--line); padding: 2.2rem 2rem; box-shadow: 0 16px 36px rgba(38,38,38,0.06);
    }
    .brand {
      display: flex; justify-content: center; align-items: center;
      margin-bottom: 1.25rem; color: var(--ink); text-decoration: none;
    }
    .brand .brand-logo-img {
      display: block; max-height: 48px; max-width: 56px;
      width: auto; height: auto; object-fit: contain;
      background: transparent;
    }
    h1 {
      font-family: var(--font-display); font-size: clamp(1.9rem, 4vw, 2.4rem);
      font-weight: 500; letter-spacing: -0.03em; margin-bottom: .35rem; text-align: center;
    }
    .sub { text-align: center; color: var(--ink-soft); font-size: .92rem; margin-bottom: 1.5rem; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); margin-bottom: 1rem; }
    .tab {
      border: 0; background: var(--bg); padding: .75rem; font-family: var(--font-body);
      font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
      color: var(--ink-soft); cursor: pointer;
    }
    .tab.active { background: var(--panel); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .group { margin-bottom: .9rem; }
    label {
      display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--dash); font-weight: 600; margin-bottom: .35rem;
    }
    input {
      width: 100%; min-height: 44px; border: 1px solid var(--line-strong);
      background: #fff; padding: .72rem .85rem; color: var(--ink); font-family: var(--font-body); font-size: .95rem;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
    .btn {
      width: 100%; min-height: 44px; border: 1px solid var(--accent); background: var(--accent);
      color: var(--accent-ink); text-transform: uppercase; letter-spacing: .1em;
      font-size: .72rem; font-weight: 600; font-family: var(--font-body); cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .15s ease;
    }
    .btn:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
    .btn:active { transform: scale(.98); }
    .msg { display: none; margin-bottom: .8rem; padding: .7rem .8rem; border: 1px solid var(--line); font-size: .85rem; }
    .msg.show { display: block; }
    .msg.error { color: #8b3d3d; background: #f7eaea; border-color: #e2c4c4; }
    .msg.success { color: #2f6b5a; background: #e8f2ee; border-color: #b9d4c8; }
    .back { display: inline-block; margin-top: 1.1rem; font-size: .85rem; color: var(--ink-soft); text-decoration: none; }
    .back:hover { color: var(--accent); }
    .hint { font-size: .82rem; color: var(--ink-soft); margin-bottom: .9rem; line-height: 1.5; }
    .optional { font-weight: 400; letter-spacing: .04em; text-transform: none; color: var(--dash); }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <a href="/index.html" class="brand" aria-label="NŌVA PILATES STUDIO">
        <img src="/assets/branding/logo-isotipo.svg" alt="NŌVA" class="brand-logo-img" width="56" height="50" decoding="async" fetchpriority="high" />
      </a>
      <h1 id="cardTitle">Bienvenida</h1>
      <p class="sub" id="cardSub">Accede a tu espacio personal</p>

      <div class="tabs" id="authTabs">
        <button class="tab active" type="button" data-tab="login">Iniciar sesion</button>
        <button class="tab" type="button" data-tab="recover">Recuperar</button>
      </div>

      <div id="msg" class="msg" role="status"></div>

      <div id="panel-login" class="panel active">
        <p class="hint">Si es tu primera vez, usa “Recuperar” para recibir un enlace seguro y elegir tu contraseña.</p>
        <form id="loginForm" novalidate>
          <div class="group">
            <label for="email">Correo</label>
            <input id="email" type="email" required autocomplete="email" />
          </div>
          <div class="group">
            <label for="password">Contraseña <span class="optional">(si ya la tienes)</span></label>
            <input id="password" type="password" autocomplete="current-password" minlength="6" />
          </div>
          <button class="btn" id="loginBtn" type="submit">Entrar</button>
        </form>
      </div>

      <div id="panel-recover" class="panel">
        <p class="hint">Te enviaremos un enlace a tu correo para elegir una contraseña nueva.</p>
        <form id="recoverForm" novalidate>
          <div class="group">
            <label for="recoverEmail">Correo</label>
            <input id="recoverEmail" type="email" required autocomplete="email" />
          </div>
          <button class="btn" id="recoverBtn" type="submit">Enviar enlace</button>
        </form>
      </div>

      <div id="panel-reset" class="panel">
        <p class="hint" id="resetHint">Elige una contraseña nueva (mínimo 6 caracteres).</p>
        <form id="resetForm" novalidate>
          <div class="group">
            <label for="newPassword">Nueva contraseña</label>
            <input id="newPassword" type="password" required autocomplete="new-password" minlength="6" />
          </div>
          <div class="group">
            <label for="newPassword2">Repetir contraseña</label>
            <input id="newPassword2" type="password" required autocomplete="new-password" minlength="6" />
          </div>
          <button class="btn" id="resetBtn" type="submit">Guardar contraseña</button>
        </form>
      </div>

      <a class="back" href="/index.html">Volver al inicio</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script src="/supabase.js?v=20260716c"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/cookies-consent.js"></script>
  <script>
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');
    const msg = document.getElementById('msg');
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let firstActivationMode = false;

    function showMsg(text, type) { msg.textContent = text; msg.className = `msg show ${type}`; }
    function hideMsg() { msg.className = 'msg'; msg.textContent = ''; }

    function showPanel(name) {
      panels.forEach((p) => p.classList.remove('active'));
      const el = document.getElementById(`panel-${name}`);
      if (el) el.classList.add('active');
      tabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
      const isReset = name === 'reset';
      document.getElementById('authTabs').style.display = isReset ? 'none' : 'grid';
      if (isReset && firstActivationMode) {
        document.getElementById('cardTitle').textContent = 'Crea tu contraseña';
        document.getElementById('cardSub').textContent = 'Es tu primer acceso a NŌVA';
        document.getElementById('resetHint').textContent =
          'Elige la contraseña que quieras usar a partir de ahora (mínimo 6 caracteres).';
      } else if (isReset) {
        document.getElementById('cardTitle').textContent = 'Nueva contraseña';
        document.getElementById('cardSub').textContent = 'Restablece el acceso a tu cuenta';
        document.getElementById('resetHint').textContent =
          'Elige una contraseña nueva (mínimo 6 caracteres).';
      } else {
        document.getElementById('cardTitle').textContent = 'Bienvenida';
        document.getElementById('cardSub').textContent = 'Accede a tu espacio personal';
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        firstActivationMode = false;
        showPanel(tab.dataset.tab);
        hideMsg();
      });
    });

    async function redirectAfterLogin(user) {
      const { data: sessionData } = await novaSupabase.auth.getSession();
      if (!sessionData?.session) throw new Error('La sesion no se guardo. Prueba otra vez.');
      const { data: profile } = await novaSupabase
        .from('perfiles')
        .select('rol,debe_definir_password')
        .eq('id', user.id)
        .maybeSingle();
      if (profile?.debe_definir_password) {
        firstActivationMode = true;
        showPanel('reset');
        showMsg('Elige tu contraseña para continuar.', 'success');
        return;
      }
      const rol = profile?.rol || 'cliente';
      const redirects = {
        cliente: '/dashboard_cliente.html',
        empleado: '/dashboard_staff.html',
        admin: '/dashboard_staff.html'
      };
      window.location.assign(redirects[rol] || '/dashboard_cliente.html');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (!email) return showMsg('Introduce tu correo.', 'error');
      if (!emailRe.test(email)) return showMsg('Introduce un correo válido.', 'error');
      try {
        showPageSpinner(true);
        if (!password) {
          showPanel('recover');
          document.getElementById('recoverEmail').value = email;
          showMsg('Para el primer acceso o si no recuerdas tu contraseña, usa el enlace de recuperación por email.', 'info');
          return;
        }
        if (password.length < 6) return showMsg('La contraseña debe tener al menos 6 caracteres.', 'error');
        const { data, error } = await novaSupabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (!data?.user) throw new Error('No se pudo obtener la sesion.');
        await redirectAfterLogin(data.user);
      } catch (err) {
        showMsg(friendlyError(err), 'error');
      } finally {
        showPageSpinner(false);
      }
    });

    document.getElementById('recoverForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();
      const email = document.getElementById('recoverEmail').value.trim();
      if (!email) return showMsg('Introduce un correo.', 'error');
      if (!emailRe.test(email)) return showMsg('Introduce un correo válido.', 'error');
      try {
        showPageSpinner(true);
        const { error } = await novaSupabase.auth.resetPasswordForEmail(email, {
          redirectTo: `${window.location.origin}/login.html?reset=true`
        });
        if (error) throw error;
        showMsg('Si el correo existe, recibirás un enlace para restablecer la contraseña.', 'success');
      } catch (err) {
        showMsg(friendlyError(err), 'error');
      } finally {
        showPageSpinner(false);
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('newPassword2').value;
      if (!p1 || !p2) return showMsg('Completa ambos campos.', 'error');
      if (p1.length < 6) return showMsg('La contraseña debe tener al menos 6 caracteres.', 'error');
      if (p1 !== p2) return showMsg('Las contraseñas no coinciden.', 'error');
      try {
        showPageSpinner(true);
        const { error } = await novaSupabase.auth.updateUser({ password: p1 });
        if (error) throw error;
        if (firstActivationMode) {
          const { error: flagErr } = await novaSupabase.rpc('cliente_marcar_password_definida');
          if (flagErr) console.warn('marcar password:', flagErr);
          firstActivationMode = false;
        }
        showMsg('Contraseña guardada. Entrando…', 'success');
        const { data: { user } } = await novaSupabase.auth.getUser();
        if (user) await redirectAfterLogin(user);
        else showPanel('login');
      } catch (err) {
        showMsg(friendlyError(err), 'error');
      } finally {
        showPageSpinner(false);
      }
    });

    novaSupabase.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        firstActivationMode = false;
        showPanel('reset');
        hideMsg();
      }
    });

    if (new URLSearchParams(location.search).get('reset') === 'true') {
      firstActivationMode = false;
      showPanel('reset');
      showMsg('Introduce tu nueva contraseña.', 'success');
    }
  </script>
</body>
</html>
